<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
    *{
        box-sizing: border-box;
    }
    body{
    width: 100vw;
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background:rgb(121, 227, 253);
    }
    .container {
        width: 420px;
        min-height: 520px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-radius: 30px;
        padding: 24px;
        border: 5px solid rgba(0, 0, 0, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        background:url('img2.jpg') center/cover no-repeat;
    }
    .display{
        height: 80px;
        width: 375px;
        border-radius: 14px;
        border: 3px solid black;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 18px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        color: yellow;
    }
    .buttons{
        display: grid;
        grid-template-columns: repeat(5,60px);
        grid-auto-rows: 60px;
        gap: 17.5px;
        border-radius: 10px;
        padding: 10px;
        align-items: center;
        justify-content: center;
    }
    .button {
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.15s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        font-size: 18px;
        font-weight: 600;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
            0 20px 40px rgba(0, 0, 0, 0.28),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
    }
    .button:hover {
        transform: translateY(-2px);
        background: transparent;
        box-shadow:
            0 24px 40px rgba(0, 0, 0, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .num {
        background: rgba(255, 255, 255, 0.2);
        color: #f8fafc;
        backdrop-filter: blur(8px);
    }
    .operator {
        background: rgba(220, 244, 10, 0.707);
        color: #f8fafc;
        border-color: rgba(96, 125, 139, 0.35);
    }
    .specialchar1{
        background: rgba(219, 25, 18, 0.87);
        color: white;
        border: rgba(227, 53, 47, 0.5);
        box-shadow: 0 18px 30px rgba(239, 68, 68, 0.35);
        width: 135px;
    }
    .specialchar2 {
        background:rgba(219, 25, 18, 0.87);
        color: white;
        border: rgba(227, 53, 47, 0.5);
        box-shadow: 0 18px 30px rgba(239, 68, 68, 0.35);
    }
    
    .equ,.add {
        background:  rgba(219, 25, 18, 0.87);
        color: white;
        border: none;
        box-shadow: 0 22px 35px rgba(37, 99, 235, 0.35);
        height: 135px
    }
</style>
<body>
    <div class="container">
        <div class="input">
            <div class="display"></div>
        </div>
        <div class="buttons">
            <div class="button specialchar1" style="grid-column: 1 / 2;">AC</div>
            <div class="button specialchar2" style="grid-column: 3 / 4;">C</div>
            <div class="button num operator" style="grid-column: 4 / 5;">(</div>
            <div class="button num operator" style="grid-column: 5 / 6;">)</div>

            <div class="button num" style="grid-column: 1 / 2;">7</div>
            <div class="button num" style="grid-column: 2 / 3;">8</div>
            <div class="button num" style="grid-column: 3 / 4;">9</div>
            <div class="button num operator" style="grid-column: 4 / 5;">-</div>
            <div class="button num operator add" style="grid-column: 5 / 6; grid-row: 2 / 4;">+</div>

            <div class="button num" style="grid-column: 1 / 2; grid-row: 3 / 4;">4</div>
            <div class="button num" style="grid-column: 2 / 3; grid-row: 3 / 4;">5</div>
            <div class="button num" style="grid-column: 3 / 4; grid-row: 3 / 4;">6</div>
            <div class="button num operator" style="grid-column: 4 / 5; grid-row: 3 / 4;">*</div>

            <div class="button num" style="grid-column: 1 / 2; grid-row: 4 / 5;">1</div>
            <div class="button num" style="grid-column: 2 / 3; grid-row: 4 / 5;">2</div>
            <div class="button num" style="grid-column: 3 / 4; grid-row: 4 / 5;">3</div>
            <div class="button num operator" style="grid-column: 4 / 5; grid-row: 4 / 5;">/</div>
            <div class="button equ" style="grid-column: 5 / 6; grid-row: 4 / 6;">=</div>

            <div class="button num" style="grid-column: 1 / 2; grid-row: 5 / 6;">00</div>
            <div class="button num" style="grid-column: 2 / 3; grid-row: 5 / 6;">0</div>
            <div class="button num" style="grid-column: 3 / 4; grid-row: 5 / 6;">.</div>
            <div class="button num operator" style="grid-column: 4 / 5; grid-row: 5 / 6;">%</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
